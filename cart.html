<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bitebox Onboarding Project</title>
        <script src="https://kit.fontawesome.com/d7017b0a4b.js" crossorigin="anonymous"></script>
         
        <link href="css/cart.css" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family==swap" rel="stylesheet">
    </head>
    
    <body>
         <header>
            <nav>
            
                    <!--logo-->
                    <img src="images/logo2.png" alt="logo" width="130px">
                    


                    <!--menu section-->
                    <ul>
                        <li><a href="index.html" class="active"> Home</a></li>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="contact.html"> Contact Us</a></li>
                        <li><a href="menu.html">Menu</a></li>
                        <li><a href="biteDeals.html">Bite Deals</a></li>
                        <li><a href="cart.html"><i class="fa-solid fa-cart-plus"></i></a></li>
                        <li><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i></a></li>
                    </ul>
                
            </nav>
        </header>

        <!--start cart section-->
        <section class="cart">
            <table>
                <thead>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Remove</th>
                </thead>

                <tbody>
                    <tr>
                        <td class="items">
                            <img src="images/Burger.jpg">
                            <div>
                                <h4>Cheese Burger</h4>
                                <p>Juicey grilled burger</p>
                            </div>
                        </td>
                        <td>₹199</td>
                        <td>
                            <div class="qty-box">
                                <button>-</button>
                                <span>1</span>
                                <button>+</button>
                            </div>
                        </td>
                        <td>₹199</td>
                        <td>
                            <button class="remove">x</button>
                        </td>
                    </tr>
                    <tr class="grand-total">
                        <td colspan="3">Grand Total</td>
                        <td>₹199</td>
                        <td><button>Proceed</button></td>
                    </tr>
                </tbody>
            </table>
        </section>
        <!--end cart section-->
    </body>
</html>
